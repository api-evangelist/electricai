aid: electricai
name: Electric.ai
description: >-
  Electric (electric.ai) is an all-in-one IT and security management platform built
  for small and mid-sized businesses that lack an in-house IT team. From a single IT
  Hub it automates employee onboarding and offboarding, device (MDM) management,
  application provisioning and access, credential/password management, and security
  posture, and it syncs with the customer's HR system so records stay clean across
  the employee lifecycle. Electric is delivered as a sales-led SaaS with a customer
  application (my.electric.ai), a knowledge base (support.electric.ai), transparent
  per-employee pricing tiers, and an Atlassian Statuspage. It integrates with tools
  such as JumpCloud, Google Workspace, Microsoft 365, Slack, Justworks, Keeper, and
  Drata, but does not publish a public developer API or OpenAPI; partner data flows
  in through partners' APIs (e.g. Justworks Partner API, Merge).
